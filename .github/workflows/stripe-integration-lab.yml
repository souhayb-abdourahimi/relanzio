name: Stripe integration lab (isolated)
# Real server of this commit + LOCAL Supabase stack (Docker, on a throw-away GitHub runner) + a SEPARATE Stripe
# TEST sandbox. Never production. Isolation proofs and owner set-up: lab/README.md.
#
#   job "infra"  - every push on lab/** : no secret, no environment. Proves the infrastructure.
#   job "stripe" - ONLY on branch lab/stripe-run AND only after a required reviewer approves the protected
#                  environment "stripe-lab". Its first step (gate) checks, before the key is ever used, that the
#                  commit is the one the owner approved (LAB_APPROVED_COMMIT), that the application code is
#                  byte-identical to PR #16 (76a803bb) and that the environment really requires a reviewer.
#                  Then the isolation proof; then the real Stripe TEST scenarios (certified only at 100 %).
on:
  push:
    branches: ['lab/**']
permissions:
  contents: read
concurrency:
  group: stripe-integration-lab-${{ github.ref }}
  cancel-in-progress: false
env:
  NODE_ENV: development
  APP_URL: http://127.0.0.1:3000
  LAB_SERVER_URL: http://127.0.0.1:3000
  PORT: '3000'
  STRIPE_EXPECTED_MODE: test
  LAB_REST_CONTAINER: supabase_rest_relanzio-lab
  BILLING_ENABLED: 'true'
  COMMERCIAL_OUTREACH_SEND_ENABLED: 'false'
  FOLLOWUP_AUTOMATION_ENABLED: 'false'
  LIFECYCLE_EMAILS_ENABLED: 'false'
  BILLING_EMAILS_ENABLED: 'false'
  # Lab-only admin (local Auth user created by prepare-lab.mjs), used only to read /api/admin/readiness.
  ADMIN_EMAILS: lab-admin@example.com
jobs:
  infra:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: "Gate report (commit, application code = PR #16, environment protection) - never blocks here"
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/lab/gate-check.mjs report
      - uses: ./.github/actions/lab-setup
      - name: "Without any Stripe key: server on the local stack, billing fails closed"
        env:
          STRIPE_EXPECTED_ACCOUNT_ID: acct_labNotConfigured
          STRIPE_PRO_PRICE_ID: price_labNotConfigured
        run: |
          node scripts/lab/isolation-check.mjs network
          node server/index.js > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1 && break; sleep 1; done
          node scripts/lab/infra-checks.mjs
          sudo bash scripts/lab/egress-firewall.sh verify
          kill %1 || true
          echo "--- server log"; tail -n 20 "$RUNNER_TEMP/server.log"

  stripe:
    needs: infra
    if: github.ref == 'refs/heads/lab/stripe-run'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: stripe-lab
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: "Gate (fail closed, before the key is used): approved commit, code = PR #16, environment protected"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LAB_APPROVED_COMMIT: ${{ vars.LAB_APPROVED_COMMIT }}
        run: node scripts/lab/gate-check.mjs enforce
      - uses: ./.github/actions/lab-setup
        with:
          pull-stripe-cli: 'true'
      - name: "Stripe sandbox check: TEST key, not the production account, no webhook endpoint, 29 EUR price"
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_LAB_SECRET_KEY }}
          STRIPE_EXPECTED_ACCOUNT_ID: ${{ vars.STRIPE_LAB_ACCOUNT_ID }}
          PRODUCTION_STRIPE_ACCOUNT_ID: ${{ vars.PRODUCTION_STRIPE_ACCOUNT_ID }}
          STRIPE_PRO_PRICE_ID: ${{ vars.STRIPE_LAB_PRICE_ID }}
        run: node scripts/lab/isolation-check.mjs stripe
      - name: "Real Stripe TEST scenarios (Checkout in a browser, linking order, redelivery, lifecycle)"
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_LAB_SECRET_KEY }}
          STRIPE_API_KEY: ${{ secrets.STRIPE_LAB_SECRET_KEY }}
          STRIPE_EXPECTED_ACCOUNT_ID: ${{ vars.STRIPE_LAB_ACCOUNT_ID }}
          PRODUCTION_STRIPE_ACCOUNT_ID: ${{ vars.PRODUCTION_STRIPE_ACCOUNT_ID }}
          STRIPE_PRO_PRICE_ID: ${{ vars.STRIPE_LAB_PRICE_ID }}
        run: |
          set -euo pipefail
          docker run -d --name lab-stripe-listen --network host -e STRIPE_API_KEY stripe/stripe-cli:latest listen \
            --events checkout.session.completed,customer.subscription.created,customer.subscription.updated,customer.subscription.deleted,invoice.paid,invoice.payment_failed \
            --forward-to http://127.0.0.1:3999/relay >/dev/null
          WHSEC=""
          for i in $(seq 1 60); do WHSEC=$(docker logs lab-stripe-listen 2>&1 | grep -o 'whsec_[A-Za-z0-9]*' | head -n 1 || true); [ -n "$WHSEC" ] && break; sleep 1; done
          [ -n "$WHSEC" ] || { echo "stripe listen did not start"; exit 1; }
          echo "::add-mask::$WHSEC"
          STRIPE_WEBHOOK_SECRET="$WHSEC" node server/index.js > "$RUNNER_TEMP/server.log" 2>&1 &
          # Not /api/readiness: in production it also requires Brevo, deliberately absent from the lab (unchanged rule).
          # server-ready.mjs requires Supabase + Stripe verified by the server itself, and Brevo ABSENT.
          node scripts/lab/server-ready.mjs
          STRIPE_WEBHOOK_SECRET="$WHSEC" node scripts/lab/stripe-run.mjs
      - name: Stop the listener
        if: always()
        run: docker rm -f lab-stripe-listen >/dev/null 2>&1 || true
      - name: Diagnostics on failure (no secret is printed)
        if: failure()
        run: tail -n 80 "$RUNNER_TEMP/server.log" 2>/dev/null || true
      - name: Checkout screenshots on failure (test data only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lab-checkout-screenshots
          path: lab-checkout-*.png
          retention-days: 3
          if-no-files-found: ignore
