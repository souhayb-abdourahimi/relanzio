name: Diagnostic Railway Docker build
on:
  push:
    branches: [diag/railway-docker-build]
jobs:
  docker-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: docker build (same Dockerfile as Railway, placeholder build args)
        run: |
          docker build --progress=plain -t relanzio-diag \
            --build-arg APP_URL=https://relanzio.com --build-arg VITE_BILLING_ENABLED=true \
            --build-arg VITE_LEGAL_PHONE=0745257878 --build-arg VITE_SUPABASE_URL=https://placeholder.supabase.co \
            --build-arg VITE_SUPABASE_ANON_KEY=placeholder --build-arg VITE_SUPPORT_EMAIL=support@relanzio.com \
            --build-arg VITE_CONTACT_EMAIL=support@relanzio.com . 2>&1 | tee build.log
          test "${PIPESTATUS[0]}" -eq 0
      - name: container starts and answers /api/health
        run: |
          docker run -d --name app -p 3000:3000 -e NODE_ENV=production -e APP_URL=https://relanzio.com -e EMAIL_LINK_SECRET=diag-dummy-not-a-real-secret-0000 relanzio-diag
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/api/health && exit 0; sleep 1; done
          docker logs app; exit 1
