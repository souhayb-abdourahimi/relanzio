name: Relanzio CI
on:
  push:
  pull_request:
jobs:
  test-build:
    # Pinned: ubuntu-latest moved to 26.04, which Playwright 1.55 cannot install browsers for.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run build
      - name: SQL migrations, rollbacks and SQL tests (throwaway Postgres)
        env:
          PGURL: postgresql://postgres@127.0.0.1:5432/postgres
        run: npm run test:sql
      - name: shared job lease, independent processes (throwaway Postgres)
        env:
          JOB_LEASE_PG_URL: postgresql://postgres@127.0.0.1:5432/postgres
          JOB_LEASE_REQUIRED: '1'
        run: node --test test/job-lease-processes.test.js
      - name: mobile navigation browser DOM
        run: |
          # Keep the lockfile: --no-package-lock re-resolved the whole tree and hit a 404 on rollup 4.66.0.
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
          npm run dev:client -- --host 127.0.0.1 >/tmp/relanzio-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill $VITE_PID || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5173/mobile-fixture.html >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5173/mobile-fixture.html >/dev/null
          npx playwright test test/mobile-nav.browser.spec.js --reporter=line
      - name: browser E2E (fake API, 1366 px and 390 px)
        run: npm run test:e2e
      - name: public pages readable without JavaScript (prerendered HTML)
        run: npm run test:nojs
  backup-restore:
    # Backup job: real pg_dump / restore round trips on throwaway PostgreSQL 17 clusters (no service, no network).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: PostgreSQL 17 from the official PGDG repository
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-17 postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version
      - name: backup / restore end to end (PostgreSQL 17)
        env:
          BACKUP_E2E_PG_BIN: /usr/lib/postgresql/17/bin
          BACKUP_E2E_REQUIRED: '1'
        run: node --test test/backup-restore-e2e.test.js
      - name: backup job image builds and passes the same test inside the image
        run: |
          docker build -f ops/backup/Dockerfile -t relanzio-backup:ci .
          docker run --rm -v "$PWD:/repo:ro" -w /repo -e BACKUP_E2E_PG_BIN=/usr/lib/postgresql/17/bin -e BACKUP_E2E_REQUIRED=1 \
            relanzio-backup:ci node --test test/backup-restore-e2e.test.js
